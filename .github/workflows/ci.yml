name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # пакет `tools` снят из SDK
          packages: platform-tools

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "tmdb.api.key=${{ secrets.TMDB_API_KEY }}"
          } > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JVM)
        run: ./gradlew :feature:afisha:jvmTest --stacktrace

      - name: Assemble Android debug
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Package Desktop (Uber JAR)
        run: ./gradlew :desktopApp:packageUberJarForCurrentOS --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Desktop Uber JAR
        uses: actions/upload-artifact@v4
        with:
          name: desktop-uber-jar
          path: desktopApp/build/compose/jars/*.jar
          if-no-files-found: error
