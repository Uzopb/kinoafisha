<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>КиноАфиша — новинки кино</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="container header__inner">
      <button class="burger" id="burger" type="button" aria-label="Меню жанров">
        <span></span><span></span><span></span>
      </button>

      <!-- десктоп-навигация (на мобильной — нижний таб-бар) -->
      <nav class="nav nav--top">
        <a class="nav__link is-active" data-nav="feed" href="#">Новинки</a>
        <a class="nav__link" data-nav="favorites" href="#">Избранное</a>
      </nav>

      <label class="search" id="searchWrap">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="searchInput" placeholder="Поиск по названию…" autocomplete="off" />
        <button class="search__clear" id="searchClear" type="button" hidden>✕</button>
      </label>
    </div>
  </header>

  <!-- ===== Боковое меню: жанры ===== -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer__overlay" data-drawer-close></div>
    <aside class="drawer__panel">
      <div class="drawer__head">
        <span class="drawer__title">Жанры</span>
        <button class="drawer__close" data-drawer-close type="button" aria-label="Закрыть">✕</button>
      </div>
      <div class="drawer__genres" id="genreList"></div>
    </aside>
  </div>

  <!-- ===== View: Feed (новинки) ===== -->
  <main class="container view is-active" id="view-feed">
    <div class="feed-toolbar">
      <h1 class="section-title" id="feedTitle">Новинки</h1>
      <div class="feed-toolbar__actions">
        <div class="layout-toggle" role="group" aria-label="Вид списка">
          <button class="layout-toggle__btn is-active" type="button" data-layout="list" aria-label="Список" title="Список">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <button class="layout-toggle__btn" type="button" data-layout="grid" aria-label="Сетка" title="Сетка">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
        </div>
        <label class="sort">
          <span class="sort__label">Сортировка</span>
          <select id="sortSelect" aria-label="Сортировка">
            <option value="popularity">По популярности</option>
            <option value="rating.desc">По рейтингу ↓</option>
            <option value="rating.asc">По рейтингу ↑</option>
            <option value="year.desc">По году ↓</option>
            <option value="year.asc">По году ↑</option>
          </select>
        </label>
      </div>
    </div>
    <div class="feed" id="feedList"></div>
    <p class="empty" id="feedEmpty" hidden>По запросу ничего не найдено.</p>
    <button class="load-more" id="feedMore" type="button" hidden>Дальше</button>
  </main>

  <!-- ===== View: Favorites ===== -->
  <main class="container view" id="view-favorites">
    <div class="feed-toolbar">
      <h1 class="section-title">Избранное</h1>
      <div class="feed-toolbar__actions">
        <div class="layout-toggle" role="group" aria-label="Вид списка">
          <button class="layout-toggle__btn is-active" type="button" data-layout="list" aria-label="Список" title="Список">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <button class="layout-toggle__btn" type="button" data-layout="grid" aria-label="Сетка" title="Сетка">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
        </div>
        <label class="sort">
          <span class="sort__label">Сортировка</span>
          <select id="favSortSelect" aria-label="Сортировка избранного">
            <option value="popularity">По умолчанию</option>
            <option value="rating.desc">По рейтингу ↓</option>
            <option value="rating.asc">По рейтингу ↑</option>
            <option value="year.desc">По году ↓</option>
            <option value="year.asc">По году ↑</option>
          </select>
        </label>
      </div>
    </div>
    <div class="feed" id="favList"></div>
    <div class="empty empty--fav" id="favEmpty" hidden>
      <div class="empty__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-8-4.7-10.5-9.5C-.3 7.9 2.3 4 6.2 4c2.3 0 3.9 1.3 5.8 3.4C13.9 5.3 15.5 4 17.8 4c3.9 0 6.5 3.9 4.7 7.5C20 16.3 12 21 12 21z"/></svg>
      </div>
      <p>Пока пусто. Отмечайте понравившееся сердечком — оно появится здесь.</p>
    </div>
  </main>

  <!-- ===== View: Details ===== -->
  <main class="container view" id="view-details">
    <button class="back" id="detailsBack" type="button">Назад</button>

    <div class="details">
      <div class="details__poster" id="dPoster">
        <span class="details__emoji" id="dEmoji"></span>
      </div>

      <div class="details__info">
        <div class="details__head">
          <h1 class="details__title" id="dTitle"></h1>
          <button class="fav-btn fav-btn--lg" id="dFav" type="button" aria-label="В избранное">
            <svg class="fav-btn__icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 21s-8-4.7-10.5-9.5C-.3 7.9 2.3 4 6.2 4c2.3 0 3.9 1.3 5.8 3.4C13.9 5.3 15.5 4 17.8 4c3.9 0 6.5 3.9 4.7 7.5C20 16.3 12 21 12 21z"/></svg>
          </button>
        </div>
        <p class="details__meta" id="dMeta"></p>
        <div class="details__rating" id="dRating"></div>
        <p class="details__desc" id="dDesc"></p>
      </div>
    </div>

    <h2 class="subsection-title">Отзывы <span class="reviews-count" id="reviewsCount"></span></h2>
    <div class="reviews" id="reviewsList"></div>
  </main>

  <!-- ===== Bottom tab bar (mobile) ===== -->
  <nav class="tabbar">
    <button class="tabbar__item is-active" data-nav="feed" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Новинки</span>
    </button>
    <button class="tabbar__item" data-nav="favorites" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-8-4.7-10.5-9.5C-.3 7.9 2.3 4 6.2 4c2.3 0 3.9 1.3 5.8 3.4C13.9 5.3 15.5 4 17.8 4c3.9 0 6.5 3.9 4.7 7.5C20 16.3 12 21 12 21z"/></svg>
      <span>Избранное</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
